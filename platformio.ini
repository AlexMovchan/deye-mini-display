; Автономне міні-табло Deye. Див. docs/PLAN.md.
;   pio run -e board -t upload   — зібрати й прошити плату NiceMCU-32S-DEV 2.8IPS по USB
;   pio test -e native           — тести чистої логіки (lib/core) на ПК
;   pio test -e render           — рендер екранів на ПК (PPM у теку з RENDER_DIR)

[platformio]
default_envs = board

; Arduino-ESP32 3.x — pioarduino (офіційна платформа PlatformIO його не має), закріплений реліз.
[env:board]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32dev
; 4 МБ флешу, два слоти по 1,9 МБ (на майбутнє оновлення по Wi-Fi), без SPIFFS — вебсторінки вбудовані в прошивку
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    lvgl/lvgl@9.5.0

[env:native]
platform = native
test_framework = unity
test_filter = test_core
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DNATIVE_TEST
    -std=gnu++17

; Рендер екранів src/ui.cpp на ПК тим самим LVGL (для звірки з макетами без плати)
[env:render]
platform = native
test_framework = unity
test_filter = test_render
test_build_src = yes
build_src_filter = +<ui.cpp> +<fonts/>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    lvgl/lvgl@9.5.0
build_flags =
    -DNATIVE_TEST
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
