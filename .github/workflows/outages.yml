# Графіки відключень: раз на 30 хв забрати з сайтів обленерго, звести до спільного формату (outages/README.md)
# і опублікувати на GitHub Pages: https://alexmovchan.github.io/deye-mini-display/outages/<provider>/<черга>.json
name: outages

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"   # GitHub може запускати із затримкою 5–15 хв — для графіка це не критично

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Забрати графіки (збій джерела — лишити попередню публікацію)
        run: |
          mkdir -p site/outages
          python outages/fetch.py site/outages https://alexmovchan.github.io/deye-mini-display/outages
          echo "Графіки відключень для табло deye-mini-display: outages/<provider>/<черга>.json" > site/index.txt
          touch site/.nojekyll
          ls -R site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes fails right after the upload with "No artifacts named github-pages were found"
      # (the artifact is not visible to the API yet; ~1 run in 5 on 2026-11-28). Wait and try once more.
      - id: deploy_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 30
      - id: deploy
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
